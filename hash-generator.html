<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>비밀번호 해시 생성기 (config.js 설정용)</title>
<style>
  body { font-family: "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; max-width: 480px; margin: 60px auto; padding: 0 20px; color: #222; }
  h2 { color: #1f2f6e; }
  input { width: 100%; padding: 9px 10px; font-size: 14px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; margin: 10px 0; }
  button { background: #1f2f6e; color: #fff; border: none; padding: 9px 18px; border-radius: 6px; font-size: 14px; cursor: pointer; }
  pre { background: #f4f4f4; padding: 12px; border-radius: 6px; word-break: break-all; white-space: pre-wrap; font-size: 13px; }
  .hint { font-size: 13px; color: #666; line-height: 1.6; }
</style>
</head>
<body>
  <h2>비밀번호 해시 생성기</h2>
  <p class="hint">
    원하는 입장 비밀번호를 입력하면 SHA-256 해시값을 만들어줍니다.<br />
    이 값을 <code>config.js</code>의 <code>SITE_PASSWORD_SHA256</code>에 붙여넣으세요.<br />
    이 페이지는 어디로도 데이터를 전송하지 않고, 이 브라우저 안에서만 계산합니다.
  </p>
  <input type="text" id="pw" placeholder="원하는 비밀번호를 입력하세요" />
  <button onclick="run()">해시 생성</button>
  <pre id="out">여기에 해시값이 표시됩니다.</pre>

  <script>
    async function run() {
      const val = document.getElementById("pw").value;
      if (!val) return;
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(val));
      const hex = [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, "0")).join("");
      document.getElementById("out").textContent = hex;
    }
  </script>
</body>
</html>
